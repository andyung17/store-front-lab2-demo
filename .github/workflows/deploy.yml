name: Deploy Vue Storefront to Azure App Service

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vue App with Backend Service URLs
        env:
          VUE_APP_ORDER_SERVICE_URL: https://order-service-app-a9htgzhpbugfe4h5.belgiumcentral-01.azurewebsites.net
          VUE_APP_PRODUCT_SERVICE_URL: https://product-service-app-cucqgzg2fecegtbq.belgiumcentral-01.azurewebsites.net
        run: npm run build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'store-front'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
